name: actions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  # Allows you to run this workflow manually from the Actions tab
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          #ruby-version: 2.7 # Not necessary if `.ruby-version` is given
      # ワークショップ用の行があれば、内容と作られるスペックを Checks のサマリーに出す
      # 権限は read-only のまま。PR へのコメント投稿はしない
      - name: ワークショップ用の指定を確認
        run: bundle exec rake workshop:check

      - name: Run bundle exec rake test
        run: bundle exec rake test

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest

    # contents: gh-pages への push に必要（従来どおり）
    # pull-requests: 作成に失敗したとき PR に知らせるために必要
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          #ruby-version: 2.7 # Not necessary if `.ruby-version` is given
      - name: deploy
        run: bash ./bin/deploy.sh
        env:
          SACLOUD_ACCESS_TOKEN:        ${{ secrets.SACLOUD_ACCESS_TOKEN }}
          SACLOUD_ACCESS_TOKEN_SECRET: ${{ secrets.SACLOUD_ACCESS_TOKEN_SECRET }}
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}

      # deploy が失敗したら、PR を出した人に知らせる
      # gh-pages への push が失敗した場合もここで拾える
      - name: 失敗を PR に知らせる
        if: failure()
        run: bundle exec ruby scripts/notify_deploy_failure.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
