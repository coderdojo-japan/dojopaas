name: サーバー初期化依頼への自動応答

on:
  issues:
    types: [opened]

jobs:
  check_and_respond:
    # Issue タイトルに「初期化依頼」が含まれている場合のみ実行
    if: contains(github.event.issue.title, '初期化依頼')
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Ruby環境をセットアップ
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Issue本文からIPアドレスを抽出
        id: extract_ip
        # Issue 本文は誰でも書けるため、${{ }} でシェルに展開せず env 経由で渡す
        # （展開するとコマンド注入になり、後続ステップの SACLOUD_* に手が届く）
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # 抽出は Ruby 側（テスト済み）に任せる。シェルと二重に持たない
          # Issue フォームの「### IPアドレス」の直下だけを読むので、
          # コメント欄に書かれた IP は拾わない（旧テンプレートの Issue はフォールバックで読む）
          IP_ADDRESS=$(bundle exec ruby -r./scripts/initialize_server \
                         -e 'puts ServerInitializer.extract_ip_address(ENV["ISSUE_BODY"]).to_s')

          if [ -z "$IP_ADDRESS" ]; then
            echo "❌ Issue本文にIPアドレスが見つかりませんでした"
            echo "ip_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "📍 IPアドレスを発見: $IP_ADDRESS"
          echo "ip_address=$IP_ADDRESS" >> $GITHUB_OUTPUT
          echo "ip_found=true"          >> $GITHUB_OUTPUT

      - name: IPアドレスを検証してサーバー情報を検索
        if: steps.extract_ip.outputs.ip_found == 'true'
        id: find_server
        env:
          SACLOUD_ACCESS_TOKEN:        ${{ secrets.SACLOUD_ACCESS_TOKEN }}
          SACLOUD_ACCESS_TOKEN_SECRET: ${{ secrets.SACLOUD_ACCESS_TOKEN_SECRET }}
          CI: true
          IP_ADDRESS: ${{ steps.extract_ip.outputs.ip_address }}
        run: |
          # 統一命名パターンに従ったfind_by_ipタスクを使用
          # IP は数字とドットのみなので、env 経由で受けて rake の引数に渡す
          OUTPUT=$(bundle exec rake "server:find_by_ip[$IP_ADDRESS]" 2>&1) || EXIT_CODE=$?

          # GitHub Actions用に出力をエスケープ
          OUTPUT="${OUTPUT//'%'/'%25'}"
          OUTPUT="${OUTPUT//$'\n'/'%0A'}"
          OUTPUT="${OUTPUT//$'\r'/'%0D'}"

          if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" = "0" ]; then
            echo "server_found=true" >> $GITHUB_OUTPUT
            echo "server_info<<EOF"  >> $GITHUB_OUTPUT
            echo "$OUTPUT"           >> $GITHUB_OUTPUT
            echo "EOF"               >> $GITHUB_OUTPUT
          else
            echo "server_found=false" >> $GITHUB_OUTPUT
            echo "error_message<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT"            >> $GITHUB_OUTPUT
            echo "EOF"                >> $GITHUB_OUTPUT
          fi

      - name: Issueにコメント - サーバーが見つかった場合
        if: |
          steps.extract_ip.outputs.ip_found      == 'true' &&
          steps.find_server.outputs.server_found == 'true'
        uses: actions/github-script@v6
        # 値は env: で渡す。script: に ${{ }} を書くと JS が読まれる前に文字列が
        # 埋め込まれるので、サーバーの説明文にバッククォートが 1 つあるだけで
        # 構文エラーになり、コメントが 1 件も投稿されない
        env:
          SERVER_INFO: ${{ steps.find_server.outputs.server_info }}
          IP_ADDRESS:  ${{ steps.extract_ip.outputs.ip_address }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            // ヘルパー関数: コメント作成をDRY化
            const createIssueComment = (comment) => {
              return github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         comment
              });
            };

            const unescape = (text) => text.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');
            const serverInfo  = unescape(process.env.SERVER_INFO);
            const ipAddress   = process.env.IP_ADDRESS;
            const issueNumber = process.env.ISSUE_NUMBER;

            const comment = `## 🔍 サーバー情報を確認しました

            \`\`\`
            ${serverInfo}
            \`\`\`

            ---

            ### 📋 次のステップ

            @yasulab このサーバーを初期化する場合は、以下のコマンドを実行してください：

            #### 順に実行します
            \`\`\`bash
            # 1. 削除準備（サーバー名と道場名を Issue と見比べる）
            bundle exec rake "server:prepare_deletion[${ipAddress}]"

            # 2. サーバー削除（サーバー名は 1 の出力を見て入力する）
            bundle exec rake "server:execute_deletion[${ipAddress},<サーバー名>]"

            # 3. 空コミット作成
            bundle exec rake "server:create_empty_commit[${issueNumber}]"

            # 4. プッシュでCI/CD実行
            git push
            \`\`\`

            ⚠️ **注意**: サーバー削除は取り消せません。削除前に必ず確認してください。
            `;

            await createIssueComment(comment);

      - name: Issueにコメント - サーバーが見つからなかった場合
        if: |
          steps.extract_ip.outputs.ip_found      == 'true' &&
          steps.find_server.outputs.server_found == 'false'
        uses: actions/github-script@v6
        env:
          ERROR_MESSAGE: ${{ steps.find_server.outputs.error_message }}
          IP_ADDRESS:    ${{ steps.extract_ip.outputs.ip_address }}
        with:
          script: |
            // ヘルパー関数: コメント作成をDRY化
            const createIssueComment = (comment) => {
              return github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         comment
              });
            };

            const unescape = (text) => text.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');
            const errorMessage = unescape(process.env.ERROR_MESSAGE);
            const ipAddress    = process.env.IP_ADDRESS;

            const comment = `## ❌ サーバー情報の取得に失敗しました

            IPアドレス: \`${ipAddress}\`

            ### エラー詳細
            \`\`\`
            ${errorMessage}
            \`\`\`

            @yasulab 手動での確認が必要です。

            ### 確認コマンド
            \`\`\`bash
            bundle exec rake "server:find_by_ip[${ipAddress}]"
            \`\`\`
            `;

            await createIssueComment(comment);

      - name: Issueにコメント - IPアドレスが見つからなかった場合
        if: steps.extract_ip.outputs.ip_found == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            // ヘルパー関数: コメント作成をDRY化
            const createIssueComment = (comment) => {
              return github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body:         comment
              });
            };

            const comment = `## ⚠️ IPアドレスが見つかりませんでした

            Issue の本文から IP アドレスを読み取れませんでした。

            [初期化依頼フォーム](https://github.com/coderdojo-japan/dojopaas/issues/new?template=initialize_server.yml)の
            **IPアドレス** の欄に、半角の数字とドットで入力して送信していただけますか（\`133.242.xxx.xxx\` の形です）。

            ご自身のサーバーの IP アドレスは、[サーバーの一覧表](https://github.com/coderdojo-japan/dojopaas/blob/gh-pages/instances.csv)からご確認いただけます。

            @yasulab 手動での確認をお願いします。
            `;

            await createIssueComment(comment);
